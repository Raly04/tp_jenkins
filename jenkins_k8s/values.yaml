# =============================================================================
# values.yaml — Jenkins sur Kubernetes (chart officiel jenkins/jenkins)
# TP3 ENI — Mini Projet Jenkins / Docker / Kubernetes
# =============================================================================
# Les clés `adminUser`, `serviceType` au premier niveau du PDF sont celles de
# l'ancien chart stable/jenkins (2020, déprécié). Dans le chart actuel (5.x),
# tout se trouve sous `controller:`. Voir `helm show values jenkins/jenkins`.
# =============================================================================

controller:
  # --- Identifiants administrateur (demande du PDF) ---
  adminUser: "admin"
  adminPassword: "admin"

  # --- Service NodePort 32000 (demande du PDF) ---
  service:
    type: "NodePort"
    port: 8080
    nodePort: 32000

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # --- Persiste les jobs/plugins/données même si le pod meurt ---
  persistence:
    enabled: true
    size: "8Gi"

  # --- ServiceAccount utilisé par les agents pod pour kubectl ---
  serviceAccount:
    create: true
    name: "jenkins"

serviceAccount:
  create: true
  name: "jenkins"

agents:
  serviceAccount: "jenkins"

# --- Blue Ocean est installé manuellement via l'UI (étape du PDF) ---
# commande : helm install --name-template jenkins -f values.yaml jenkins/jenkins
