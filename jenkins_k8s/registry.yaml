# =============================================================================
# registry.yaml — Registry Docker DANS le cluster (NodePort 30400)
# =============================================================================
# Le PDF montait `docker run -p 4000:5000 registry` sur l'hôte. Dans kind, les
# pods ne peuvent pas pousser vers localhost:4000 (localhost = le pod !).
# On héberge donc le registry dans le cluster :
#   - les agents Jenkins poussent via   registry.jenkins.svc.cluster.local:5000
#   - le kubelet (pull) passe par       localhost:30400  (NodePort + containerd
#     patché en HTTP dans kind-config.yaml)
#   - l'hôte garde le port 4000 (mapping kind) : curl localhost:4000/v2/_catalog
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: jenkins
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            # registry en HTTP (pas de TLS) : réseau interne au cluster
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: jenkins
  labels:
    app: registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30400
      name: registry
