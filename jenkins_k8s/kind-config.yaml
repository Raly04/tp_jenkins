# =============================================================================
# kind-config.yaml — Cluster kind "propre" pour le TP3
# TP3 ENI — Mini Projet Jenkins / Docker / Kubernetes
# =============================================================================
# Un cluster kind par défaut est fermé sur localhost :
#   - pas de mapping de ports (NodePorts 32000/31000 injoignables depuis l'hôte)
#   - containerd 2.x n'accepte que les registries HTTPS
# Ce fichier résout les deux.
# =============================================================================
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: tp-jenkins

# --- Niveau cluster : patch containerd (syntaxe 2.x : config_path) ---------
# Le vieux format `registry.mirrors` a été SUPPRIMÉ en containerd 2.0
# (kind v0.31+, image kindest/node v1.35). Chaque registry est désormais
# décrit par un hosts.toml dans /etc/containerd/certs.d (monté ci-dessous).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

nodes:
  - role: control-plane
    extraPortMappings:
      # Jenkins UI (NodePort du chart Helm)
      - containerPort: 32000
        hostPort: 32000
        protocol: TCP
      # App flask déployée par le pipeline (NodePort)
      - containerPort: 31000
        hostPort: 31000
        # protocol TCP implicite
      # Registry interne du cluster (NodePort) — l'hôte garde le port 4000
      - containerPort: 30400
        hostPort: 4000
        protocol: TCP
    extraMounts:
      # Fichiers hosts.toml des registries autorisés en HTTP (pull kubelet)
      - hostPath: /home/raly/Projets/Personal/tp_jenkins/jenkins_k8s/containerd-certs.d
        containerPath: /etc/containerd/certs.d
        readOnly: true
