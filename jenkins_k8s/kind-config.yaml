# =============================================================================
# kind-config.yaml — Cluster kind "propre" pour le TP3
# TP3 ENI — Mini Projet Jenkins / Docker / Kubernetes
# =============================================================================
# Un cluster kind par défaut est fermé sur localhost :
#   - pas de mapping de ports (NodePorts 32000/31000 injoignables depuis l'hôte)
#   - containerd n'accepte que les registries HTTPS
# Ce fichier résout les deux : extraPortMappings + patch containerd pour le
# registry local en HTTP.
# =============================================================================
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: tp-jenkins
nodes:
  - role: control-plane
    extraPortMappings:
      # Jenkins UI (NodePort du chart Helm)
      - containerPort: 32000
        hostPort: 32000
        protocol: TCP
      # App flask déployée par le pipeline (NodePort service/k8s)
      - containerPort: 31000
        hostPort: 31000
        protocol: TCP
      # Registry interne du cluster (NodePort, pour curl depuis l'hôte)
      - containerPort: 30400
        hostPort: 4000
        protocol: TCP
    # Déclarer les registries via config_path (syntaxe containerd 2.x) : le
    # vieux format `registry.mirrors` a été SUPPRIMÉ en containerd 2.0
    # (kind v0.31+). Chaque registry est décrit dans un hosts.toml.
    # Déclarer les registries via config_path (syntaxe containerd 2.x) : le
    # vieux format `registry.mirrors` a été SUPPRIMÉ en containerd 2.0
    # (kind v0.31+). Chaque registry est décrit dans un hosts.toml (monté
    # ci-dessous via extraMounts).
    containerdConfigPatches:
      - |-
        [plugins."io.containerd.grpc.v1.cri".registry]
          config_path = "/etc/containerd/certs.d"
    extraMounts:
      - hostPath: /home/raly/Projets/Personal/tp_jenkins/jenkins_k8s/containerd-certs.d
        containerPath: /etc/containerd/certs.d
        readOnly: true
